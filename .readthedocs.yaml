# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Specify os and python version
build:
  os: "ubuntu-24.04"
  apt_packages:
    - fonts-dejavu-core
    - fonts-noto-core
    - fonts-noto-color-emoji
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --all-extras --group docs
    build:
      html:
        # Capture worker output in a file so detached kernels cannot keep RTD's
        # output pipe open after the diagnostic deadline.
        - >-
          PYTHONUNBUFFERED=1 python scripts/rtd_sphinx.py
          -T -W --keep-going -b html -d docs/_build/doctrees
          -D language=en docs/source "${READTHEDOCS_OUTPUT}/html"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#  - pdf
