# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Specify os and python version
build:
  os: "ubuntu-24.04"
  apt_packages:
    - fonts-dejavu-core
    - fonts-noto-core
    - fonts-noto-color-emoji
  tools:
    python: "3.13"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --all-extras --group docs
    build:
      html:
        # RTD saves command output only when the command returns. Dump thread
        # stacks at 18 minutes, then stop the process group before RTD's timeout.
        - >-
          PYTHONUNBUFFERED=1 timeout --kill-after=30s 19m python -c
          'import faulthandler, runpy;
          faulthandler.dump_traceback_later(1080);
          runpy.run_module("sphinx", run_name="__main__")'
          -T -W --keep-going -b html -d docs/_build/doctrees
          -D language=en docs/source "${READTHEDOCS_OUTPUT}/html"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#  - pdf
