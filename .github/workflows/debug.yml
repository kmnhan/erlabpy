name: Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe PySide6 widget destruction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: false
          qt: true

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install compatibility 266 Qt wheel
        run: |
          uv venv --python 3.12
          uv pip install pyside6==6.12.0
          uv pip freeze > probe-dependencies.txt
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi

      - name: Inspect destruction threads
        shell: bash
        run: |
          set +e
          set -o pipefail
          gdb --batch --return-child-result \
            -x scripts/_compat266.gdb \
            --args "$PWD/.venv/bin/python" -X faulthandler \
            scripts/_compat266_probe.py 2>&1 | tee probe.log
          exit "${PIPESTATUS[0]}"

      - name: Save probe evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-266-widget-thread-probe
          path: |
            probe.log
            probe-dependencies.txt
