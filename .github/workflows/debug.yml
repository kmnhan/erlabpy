name: Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Trace Python 3.11 PySide6 smoke hang
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      PYTEST_QT_API: pyside6
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install native debugger and Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes gdb libegl1

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked smoke dependencies
        run: |
          uv sync --frozen --all-extras --dev --group pyside6
          uv pip freeze > native-dependencies.txt
          uv run --no-sync python -m scripts.ci_test_groups compat > "$RUNNER_TEMP/targets.txt"

      - name: Capture native stacks after a normal test process stalls
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/observe.py" <<'PY'
          import contextlib
          import os
          import pathlib
          import signal
          import subprocess
          import sys
          import time
          
          def interrupted(signum, frame):
              raise SystemExit(128 + signum)
          
          signal.signal(signal.SIGTERM, interrupted)
          targets = pathlib.Path(os.environ["RUNNER_TEMP"], "targets.txt").read_text().splitlines()
          command = [
              str(pathlib.Path.cwd() / ".venv" / "bin" / "pytest"),
              "--capture=tee-sys", "--no-qt-log",
              "-m", "compat", "-o", "faulthandler_timeout=300",
              "-o", "faulthandler_exit_on_timeout=true",
              "--junitxml", "native-junit.xml", "-o", "junit_family=legacy", *targets,
          ]
          log_path = pathlib.Path("smoke.log")
          started = last_progress = time.monotonic()
          read_offset = 0
          marker_tail = b""
          armed = captured = False
          environment = os.environ.copy()
          environment["VIRTUAL_ENV"] = str(pathlib.Path.cwd() / ".venv")
          environment["PATH"] = environment["VIRTUAL_ENV"] + "/bin:" + environment["PATH"]
          with log_path.open("wb", buffering=0) as output:
              child = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT,
                                       start_new_session=True, env=environment)
              try:
                  while child.poll() is None:
                      with log_path.open("rb") as reader:
                          reader.seek(read_offset)
                          new_output = reader.read()
                      if new_output:
                          read_offset += len(new_output)
                          last_progress = time.monotonic()
                          marker_window = marker_tail + new_output
                          armed |= b"tests/interactive/test_momentum_overlays.py" in marker_window
                          marker_tail = marker_window[-128:]
                          sys.stdout.buffer.write(new_output)
                          sys.stdout.buffer.flush()
                      now = time.monotonic()
                      if armed and not captured and now - last_progress >= 90:
                          captured = True
                          print("\nCapturing native stacks after 90 seconds without test output.",
                                flush=True)
                          debugger = [
                              "sudo", "-n", "timeout", "--signal=TERM", "--kill-after=5s",
                              "45s", "gdb", "-q", "--batch", "--nx",
                              "-iex", "set debuginfod enabled off", "-p", str(child.pid),
                              "-ex", "set pagination off",
                              "-ex", "set print elements 30",
                              "-ex", "set print max-depth 5",
                              "-ex", "thread apply all bt full 80",
                              "-ex", "info sharedlibrary",
                              "-ex", "detach",
                          ]
                          with pathlib.Path("native-stacks.log").open("wb") as trace:
                              result = subprocess.run(debugger, stdout=trace,
                                                      stderr=subprocess.STDOUT, timeout=55)
                          print(f"Debugger exit status: {result.returncode}", flush=True)
                      if now - started > 720:
                          raise TimeoutError("Diagnostic process exceeded 12 minutes")
                      time.sleep(1)
              finally:
                  with contextlib.suppress(ProcessLookupError):
                      os.killpg(child.pid, signal.SIGTERM)
                  cleanup_deadline = time.monotonic() + 5
                  while time.monotonic() < cleanup_deadline:
                      child.poll()
                      try:
                          os.killpg(child.pid, 0)
                      except ProcessLookupError:
                          break
                      time.sleep(0.1)
                  else:
                      with contextlib.suppress(ProcessLookupError):
                          os.killpg(child.pid, signal.SIGKILL)
                  child.wait()
          with log_path.open("rb") as reader:
              reader.seek(read_offset)
              sys.stdout.buffer.write(reader.read())
              sys.stdout.buffer.flush()
          print(f"Pytest exit status: {child.returncode}; native capture: {captured}", flush=True)
          raise SystemExit(child.returncode if child.returncode >= 0 else 128 - child.returncode)
          
          PY
          .venv/bin/python "$RUNNER_TEMP/observe.py"

      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-641-pyside-native-trace
          path: |
            smoke.log
            native-stacks.log
            native-dependencies.txt
            native-junit.xml
          if-no-files-found: error
