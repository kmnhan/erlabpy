name: Compatibility

on:
  workflow_dispatch:
    inputs:
      native_debug:
        description: Run the GUI suite under GDB with Python 3.11 and 3.14 and PySide6
        type: boolean
        default: false
      gui_tests:
        description: Space-separated GUI test paths (empty runs the full GUI suite)
        type: string
        default: ""
  schedule:
    # Every friday at 22:00 UTC (Every saturday at 07:00 KST/JST)
    - cron: "0 22 * * FRI"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  ERLAB_TEST_DATA_CACHE_DIR: /home/runner/.cache/erlabpy

jobs:
  test-data-cache:
    name: Cache Test Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load test data configuration
        shell: bash
        run: |
          set -euo pipefail
          source tests/test-data.env
          cat tests/test-data.env >> "$GITHUB_ENV"
          echo "ERLAB_TEST_DATA_DIR=$ERLAB_TEST_DATA_CACHE_DIR/kmnhan-erlabpy-data-${ERLAB_TEST_DATA_COMMIT:0:7}" >> "$GITHUB_ENV"

      - name: Restore test data cache
        id: restore-test-data
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ERLAB_TEST_DATA_CACHE_DIR }}
          key: erlabpy-data-${{ hashFiles('tests/test-data.env') }}

      - name: Populate test data cache
        if: steps.restore-test-data.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/erlabpy-data.tar.gz"
          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 5 \
            "https://codeload.github.com/kmnhan/erlabpy-data/legacy.tar.gz/${ERLAB_TEST_DATA_COMMIT}" \
            --output "$archive"
          echo "${ERLAB_TEST_DATA_ARCHIVE_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$ERLAB_TEST_DATA_CACHE_DIR"
          rm -rf "$ERLAB_TEST_DATA_DIR"
          tar -xzf "$archive" -C "$ERLAB_TEST_DATA_CACHE_DIR"
          test -d "$ERLAB_TEST_DATA_DIR/da30"
          test -d "$ERLAB_TEST_DATA_DIR/erpes"
          test -d "$ERLAB_TEST_DATA_DIR/merlin"

      - name: Save test data cache
        if: steps.restore-test-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ERLAB_TEST_DATA_CACHE_DIR }}
          key: erlabpy-data-${{ hashFiles('tests/test-data.env') }}

      - name: Verify test data cache
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ERLAB_TEST_DATA_DIR/da30"
          test -d "$ERLAB_TEST_DATA_DIR/erpes"
          test -d "$ERLAB_TEST_DATA_DIR/merlin"

  compat:
    name: Compat Python ${{ matrix.python-version }} [${{ matrix.qt-api }}]
    needs: test-data-cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISPLAY: ":99.0"
      PYTHONUNBUFFERED: "1"
      PYTEST_QT_API: ${{ matrix.qt-api }}
      QT_API: ${{ matrix.qt-api }}
      ERLAB_CI_DIAGNOSTICS_DIR: compat-diagnostics
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.native_debug && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
        qt-api: ${{ fromJSON(inputs.native_debug && '["pyside6"]' || '["pyqt6", "pyside6"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record runner configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ERLAB_CI_DIAGNOSTICS_DIR"
          {
            uname -a
            cat /etc/os-release
            lscpu
            free -m
            ulimit -a
          } > "$ERLAB_CI_DIAGNOSTICS_DIR/runner.txt"

      - name: Load test data configuration
        shell: bash
        run: |
          set -euo pipefail
          source tests/test-data.env
          cat tests/test-data.env >> "$GITHUB_ENV"
          echo "ERLAB_TEST_DATA_DIR=$ERLAB_TEST_DATA_CACHE_DIR/kmnhan-erlabpy-data-${ERLAB_TEST_DATA_COMMIT:0:7}" >> "$GITHUB_ENV"

      - uses: pyvista/setup-headless-display-action@v5
        with:
          pyvista: false
          qt: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install project with upgraded dependencies
        shell: bash
        env:
          QT_GROUP: ${{ matrix.qt-api }}
        run: |
          set -euo pipefail
          uv sync --all-extras --dev --group "$QT_GROUP" --upgrade \
            2>&1 | tee "$ERLAB_CI_DIAGNOSTICS_DIR/install.log"

      - name: Record resolved environment
        shell: bash
        run: |
          set -euo pipefail
          cp uv.lock "$ERLAB_CI_DIAGNOSTICS_DIR/uv.lock"
          uv --version > "$ERLAB_CI_DIAGNOSTICS_DIR/uv-version.txt"
          uv pip freeze --python .venv/bin/python > "$ERLAB_CI_DIAGNOSTICS_DIR/packages.txt"
          uv run --no-sync python - <<'PY' > "$ERLAB_CI_DIAGNOSTICS_DIR/python-qt.txt"
          import platform
          import sys
          from importlib.metadata import version

          import qtpy
          from qtpy import QtCore

          print(sys.version)
          print(f"Executable: {sys.executable}")
          print(f"Platform: {platform.platform()}")
          print(f"Qt binding: {qtpy.API_NAME} {version(qtpy.API_NAME)}")
          print(f"Qt runtime: {QtCore.qVersion()}")
          PY

      - name: Install native debugger
        if: inputs.native_debug
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gdb
          gdb --version > "$ERLAB_CI_DIAGNOSTICS_DIR/gdb-version.txt"

      - name: Verify native traceback capture
        if: inputs.native_debug
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          status=0
          uv run --no-sync gdb --batch --nx -x scripts/ci_gdb.gdb \
            --args .venv/bin/python -X faulthandler \
            -c 'import ctypes; ctypes.string_at(0)' \
            > "$ERLAB_CI_DIAGNOSTICS_DIR/gdb-smoke.log" 2>&1 || status=$?
          test "$status" -eq 1
          grep -q 'received signal SIGSEGV' "$ERLAB_CI_DIAGNOSTICS_DIR/gdb-smoke.log"
          grep -q 'Fatal Python error: Segmentation fault' "$ERLAB_CI_DIAGNOSTICS_DIR/gdb-smoke.log"

      - name: Restore test data cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ERLAB_TEST_DATA_CACHE_DIR }}
          key: erlabpy-data-${{ hashFiles('tests/test-data.env') }}
          fail-on-cache-miss: true

      - name: Verify test data cache
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ERLAB_TEST_DATA_DIR/da30"
          test -d "$ERLAB_TEST_DATA_DIR/erpes"
          test -d "$ERLAB_TEST_DATA_DIR/merlin"

      - name: Run compatibility suite
        shell: bash
        env:
          NATIVE_DEBUG: ${{ inputs.native_debug }}
          GUI_TESTS: ${{ inputs.gui_tests }}
        run: |
          set -euo pipefail
          ulimit -c 0
          common_args=(
            -v
            -o faulthandler_timeout=300
            -o faulthandler_exit_on_timeout=true
            -o junit_family=legacy
          )
          xdist_args=(
            -n auto
            --dist=loadgroup
            --max-worker-restart=0
          )
          pytest_command=(uv run --no-sync python -X faulthandler -m pytest)
          if [[ "$NATIVE_DEBUG" != "true" ]]; then
            /usr/bin/time -v -o "$ERLAB_CI_DIAGNOSTICS_DIR/non-gui-resources.txt" \
              "${pytest_command[@]}" \
              "${common_args[@]}" \
              "${xdist_args[@]}" \
              -m "not gui" \
              --junitxml "junit-${{ matrix.python-version }}-${{ matrix.qt-api }}-non-gui.xml" \
              2>&1 | tee "$ERLAB_CI_DIAGNOSTICS_DIR/non-gui.log"
          fi
          if [[ "$NATIVE_DEBUG" == "true" ]]; then
            pytest_command=(
              uv run --no-sync gdb --batch --nx -x scripts/ci_gdb.gdb
              --args .venv/bin/python -X faulthandler -m pytest
            )
          fi
          gui_test_paths=()
          if [[ -n "$GUI_TESTS" ]]; then
            read -r -a gui_test_paths <<< "$GUI_TESTS"
          fi
          /usr/bin/time -v -o "$ERLAB_CI_DIAGNOSTICS_DIR/gui-resources.txt" \
            "${pytest_command[@]}" \
            "${common_args[@]}" \
            --capture=tee-sys \
            --no-qt-log \
            -m gui \
            "${gui_test_paths[@]}" \
            --junitxml "junit-${{ matrix.python-version }}-${{ matrix.qt-api }}-gui.xml" \
            2>&1 | tee "$ERLAB_CI_DIAGNOSTICS_DIR/gui.log"

      - name: Record final memory availability
        if: always()
        shell: bash
        run: |
          mkdir -p "$ERLAB_CI_DIAGNOSTICS_DIR"
          free -m > "$ERLAB_CI_DIAGNOSTICS_DIR/memory-after.txt"

      - name: Upload compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compat-${{ matrix.python-version }}-${{ matrix.qt-api }}
          path: |
            junit-${{ matrix.python-version }}-${{ matrix.qt-api }}*.xml
            compat-diagnostics/
          if-no-files-found: error
