name: Publication using ERLabPy
description: Add a publication that uses ERLabPy to the README list.
title: "[Paper] "
assignees: [kmnhan]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for using ERLabPy in your research!
        Use this form to suggest your publication to the README list.
        Both published papers and preprints are welcome.

  - type: textarea
    id: citation
    attributes:
      label: Paper citation
      description: Include the authors, title, journal or preprint server, and year.
    validations:
      required: true

  - type: input
    id: paper-link
    attributes:
      label: DOI or URL
      description: Provide a DOI or a URL to the manuscript.
      placeholder: https://doi.org/...
    validations:
      required: true
